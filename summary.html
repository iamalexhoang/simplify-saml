<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Simplify SAML</title>
  <link rel="stylesheet" href="summary.css" />
</head>
<body>
  <main class="page">
    <header class="header">
      <div class="brand-block">
        <div class="brand-mark" aria-hidden="true">S</div>
        <div>
          <h1>Simplify SAML</h1>
          <p class="subtitle">The values you need for the integration.</p>
        </div>
      </div>
      <button id="copy-all" class="primary" type="button" hidden>Copy All</button>
    </header>

    <div id="load-state" class="message">Loading…</div>
    <section id="unsupported-state" class="simple-card" hidden></section>

    <div id="app" hidden>
      <div id="entity-picker-wrap" class="entity-picker" hidden>
        <label for="entity-select">Entity</label>
        <select id="entity-select"></select>
      </div>

      <section class="intro">
        <div class="intro-heading">
          <div id="role" class="role"></div>
          <span id="vendor" class="vendor-badge" hidden></span>
        </div>
        <div id="organization-name" class="organization-name" hidden></div>
        <p id="guidance"></p>
      </section>

      <section id="summary-card" class="summary-card"></section>
      <section id="warnings" class="warnings" hidden></section>

      <footer class="footer">
        <div class="footer-actions">
          <button id="download-xml" type="button">Download XML</button>
          <button id="clear-analysis" type="button">Clear</button>
        </div>
        <span class="local-note">Local only</span>
      </footer>
    </div>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="parser.js"></script>
  <script src="analyzer.js"></script>
  <script src="summary.js"></script>
</body>
</html>
